<header class="bg-white border-bottom px-4 py-3 d-flex justify-content-between align-items-center">

    <div>
        <strong>Sistema de Cashback</strong>
        <div class="text-muted small">
            Gestão de clientes, compras e benefícios
        </div>
    </div>

    <div class="d-flex align-items-center gap-3">

        {% if request.user.is_authenticated %}

                <a href="{% url 'notificacoes:lista' %}"
           class="btn btn-sm btn-outline-secondary position-relative"
           data-notificacoes-sino
           aria-label="Notificações internas"
           title="Notificações internas">
            <i class="bi bi-bell"></i>
            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                  data-notificacoes-nao-lidas="{{ notificacoes_nao_lidas }}">{{ notificacoes_nao_lidas }}</span>
        </a>
<div class="text-muted small">
            <i class="bi bi-person-circle me-1"></i>
            {{ request.user.username }}
        </div>

        <form method="post" action="{% url 'logout' %}" class="m-0">
            {% csrf_token %}

            <button type="submit" class="btn btn-sm btn-outline-danger">
                <i class="bi bi-box-arrow-right me-1"></i>
                Sair
            </button>
        </form>

        {% endif %}

    </div>

</header>
