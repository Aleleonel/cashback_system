{% extends "base.html" %}
{% block content %}
<div class="container-fluid py-4">
  <div class="mb-4"><div class="text-uppercase small fw-semibold text-secondary mb-1">Vendas e comissões</div><h1 class="h3 mb-1"><i class="bi bi-pencil-square me-2"></i>Editar meta de comissão</h1><p class="text-secondary mb-0">{{ meta.loja.nome }} - {{ matriz.nome }}</p></div>
  <div class="card shadow-sm border-0"><div class="card-body p-4"><form method="post">{% csrf_token %}
    <div class="row g-3"><div class="col-12 col-md-6"><label class="form-label" for="{{ form.valor_meta.id_for_label }}">Valor da meta</label><div class="input-group"><span class="input-group-text">R$</span>{{ form.valor_meta }}</div></div><div class="col-12 col-md-6"><label class="form-label" for="{{ form.percentual_comissao.id_for_label }}">Percentual de comissão</label><div class="input-group">{{ form.percentual_comissao }}<span class="input-group-text">%</span></div></div></div>
    <div class="form-check form-switch my-4">{{ form.ativa }}<label class="form-check-label" for="{{ form.ativa.id_for_label }}">Meta ativa</label></div>
    <div class="d-flex flex-wrap gap-2"><button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Salvar alterações</button><a href="{% url 'configuracoes:comissoes' %}{% if contexto_configuracoes.escopo == 'plataforma' %}?matriz={{ matriz.pk }}{% endif %}" class="btn btn-outline-secondary">Cancelar</a></div>
  </form></div></div>
</div>
{% endblock %}
